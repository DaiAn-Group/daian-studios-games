<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow-floor" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="#00ff00" stroke-width="2" filter="url(#glow-floor)"/>
  <rect x="16" y="16" width="32" height="32" fill="#00ff00" opacity="0.2"/>
  <line x1="0" y1="0" x2="64" y2="64" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
  <line x1="64" y1="0" x2="0" y2="64" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
</svg>